limit_req_zone $binary_remote_addr zone=pw_wallet:1m rate=6r/m;
server {
 listen 80;
 server_name pw.qianqi.site;
 location ^~ /.well-known/acme-challenge/ { root /var/www/pw-acme; }
 location / { return 301 https://pw.qianqi.site$request_uri; }
}
server {
 listen 443 ssl;
 server_name pw.qianqi.site;
 ssl_certificate /etc/letsencrypt/live/pw.qianqi.site/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/pw.qianqi.site/privkey.pem;
 include /etc/letsencrypt/options-ssl-nginx.conf;
 ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 client_max_body_size 16k;
 location ^~ /.well-known/acme-challenge/ { root /var/www/pw-acme; }
 location = /api/wallet {
  limit_req zone=pw_wallet burst=2 nodelay;
  limit_req_status 429;
  limit_except GET { deny all; }
  proxy_pass http://127.0.0.1:4196;
  proxy_set_header Host $host;
  proxy_connect_timeout 2s;
  proxy_read_timeout 40s;
 }
 location / {
  limit_except GET { deny all; }
  proxy_pass http://127.0.0.1:4196;
  proxy_set_header Host $host;
  proxy_connect_timeout 2s;
  proxy_read_timeout 15s;
 }
}
