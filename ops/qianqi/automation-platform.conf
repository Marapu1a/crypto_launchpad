# Drop-in for the existing qianqi-public-automation.service.
# Preserve its user, credentials, filesystem ownership and backup/monitor identity.
[Service]
WorkingDirectory=/opt/crypto-launchpad/qianqi-current
ExecStart=
ExecStart=/usr/bin/node scripts/run-qianqi-executor.mjs --watch
ExecStartPre=
# Operator replaces RELEASE_MANIFEST_SHA256 with the verified archive manifest digest.
ExecStartPre=/usr/bin/node /opt/crypto-launchpad/ops/verify-release.mjs /opt/crypto-launchpad/qianqi-current RELEASE_MANIFEST_SHA256
Environment=SHARED_QIANQI_EXECUTOR_BINDING=/etc/crypto-launchpad/existing-qianqi/executor.json
Environment=SHARED_EXECUTOR_DATABASE_URL=postgresql://lp_executor@localhost/launchpad_shadow?host=/var/run/postgresql
