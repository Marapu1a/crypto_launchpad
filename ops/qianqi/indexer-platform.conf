# Drop-in for the existing qianqi-public-indexer.service.
# Loopback 8789 remains the operator health/rollback endpoint; public /v1 uses shared API.
[Service]
WorkingDirectory=/opt/crypto-launchpad/qianqi-current
ExecStart=
ExecStart=/usr/bin/node server/adapters/qianqi/runtime/scripts/run-indexer-service.cjs /etc/qianqi/public/recognition-index-config.json 8789
ExecStartPre=
ExecStartPre=/usr/bin/node /opt/crypto-launchpad/ops/verify-release.mjs /opt/crypto-launchpad/qianqi-current RELEASE_MANIFEST_SHA256
Environment=SHARED_QIANQI_INDEXER_BINDING=/etc/crypto-launchpad/existing-qianqi/indexer.json
Environment=SHARED_JOBS_DATABASE_URL=postgresql://lp_jobs@localhost/launchpad_shadow?host=/var/run/postgresql
