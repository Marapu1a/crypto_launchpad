<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QIANQI bot — local preview</title>
<style>body{margin:0;background:#17212b;color:#eee;font:16px/1.5 system-ui}main{max-width:440px;margin:auto;padding:20px}h1{font-size:22px}small{display:block;color:#e7ca88;margin-bottom:24px}.message{background:#223546;padding:18px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.buttons{display:grid;gap:8px;margin-top:8px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0;background:#29465d;border:0;border-radius:8px;color:#a7d9ff;font:14px system-ui;padding:14px 8px;text-align:center;text-decoration:none;cursor:pointer}code{font-size:13px}#status{font-size:13px;color:#d6c69b}</style>
<main><h1>QIANQI Hub</h1><small>LOCAL PREVIEW · No Telegram messages are sent.</small><div id="text" class="message"></div><div id="buttons" class="buttons"></div><form style="display:flex;gap:8px;margin-top:20px"><input aria-label="Token name or contract" placeholder="Token name, ticker or contract" style="min-width:0;flex:1;padding:12px"><button type="submit">Search</button></form><p id="status" role="status"></p></main>
<script>
async function show(action='menu',query){
 const r=await fetch('/api/preview?'+(query===undefined?'action='+encodeURIComponent(action):'q='+encodeURIComponent(query))),m=await r.json();document.querySelector('#text').innerHTML=m.text;const buttons=document.querySelector('#buttons');buttons.replaceChildren();document.querySelector('#status').textContent='';
 for(const row of m.reply_markup.inline_keyboard){const div=document.createElement('div');div.className='row';for(const b of row){const el=document.createElement(b.url?'a':'button');el.textContent=b.text;if(b.url){el.href=b.url;el.target='_blank';el.rel='noopener noreferrer';}else el.onclick=()=>{if(b.copy_text){navigator.clipboard.writeText(b.copy_text.text).then(()=>document.querySelector('#status').textContent='Address copied.').catch(()=>document.querySelector('#status').textContent='Select the address above to copy it.');}else show(b.callback_data);};div.append(el);}buttons.append(div);}
}document.querySelector('form').onsubmit=e=>{e.preventDefault();show('menu',document.querySelector('input').value);};show();
</script></html>
